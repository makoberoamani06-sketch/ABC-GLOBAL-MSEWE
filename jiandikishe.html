   <main>
       <section id="register" class="register-section">
           <h2>Form ya Uanachama/Wageni</h2>
           <p>Tafadhali jaza form hii ili kuungana nasi rasmi</p>
           <form id="register-form" class="church-form" novalidate>
               <div class="form-group">
                   <label for="fullname">Majina kamili:</label>
                   <input type="text" id="fullname" name="fullname" placeholder="Ingiza majina yako" required>
                   <p class="error-message" id="error-fullname"></p>
               </div>
               <div class="form-group">
                   <label for="email">Barua pepe:</label>
                   <input type="email" id="email" name="email" placeholder="ingiza email yako">
                   <p class="error-message" id="error-email"></p>
               </div>
               <div class="form-group">
                   <label for="phone">Namba ya simu:</label>
                   <input type="tel" id="phone" name="phone" placeholder="Mfano:0766731959" required>
                   <p class="error-message" id="error-phone"></p>
               </div>
               <div class="form-group">
                   <label for="ministry">Huduma:</label>
                   <input type="text" id="ministry" name="ministry" placeholder="shemasi" required>
                   <p class="error-message" id="error-ministry"></p>
               </div>
               <div class="form-group">
                   <label for="status">Wewe ni:</label>
                   <select id="status" name="status">
                       <option value="mgeni">Mgeni (Unatembelea)</option>
                       <option value="mwenyeji">Mwenyeji (Muumini wa kudumu)</option>
                   </select>
               </div>
               <button type="submit" class="btn-submit">Tuma taarifa</button>
           </form>
           <div id="submit-result"></div>
       </section>
   </main>
